<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #reader { display: flex; height: 100vh; flex-direction: column; }

  #stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #stage img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: opacity .25s;
  }

  .nav-btn {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 15%;
    background: transparent;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,.5);
    font-size: 3rem;
    transition: background .2s, color .2s;
    z-index: 2;
  }
  .nav-btn:hover {
    background: rgba(255,255,255,.05);
    color: #fff;
  }
  #prevBtn { left: 0;  text-align: left;  padding-left: 1rem; }
  #nextBtn { right: 0; text-align: right; padding-right: 1rem; }
  .nav-btn:disabled { opacity: .2; cursor: not-allowed; }

  #counter {
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.7);
    padding: .3rem .8rem;
    border-radius: 20px;
    font-size: .9rem;
    z-index: 3;
  }

  #muteBtn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(0,0,0,.7);
    color: #fff;
    border: none;
    padding: .5rem .8rem;
    border-radius: 20px;
    cursor: pointer;
    font-size: .9rem;
    z-index: 3;
  }
  #muteBtn:hover { background: rgba(0,0,0,.9); }
</style>
</head>
<body>

<div id="reader">
  <div id="stage">
    <button class="nav-btn" id="prevBtn">‹</button>
    <img id="page" alt="">
    <button class="nav-btn" id="nextBtn">›</button>
    <div id="counter">1 / 1</div>
    <button id="muteBtn">🔊 Mute</button>
  </div>
</div>

<script>
(() => {
  const stage    = document.getElementById('stage');
  const page     = document.getElementById('page');
  const counter  = document.getElementById('counter');
  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const muteBtn  = document.getElementById('muteBtn');

  // All images in order (1-27)
  const images = [
    '1.png',
    '2.png',
    '3.png',
    '4.png',
    '5.png',
    '6.png',
    '7.png',
    '8.png',
    '9.png',
    '10.png',
    '11.png',
    '12.png',
    '13.png',
    '14.png',
    '15.png',
    '16.png',
    '17.png',
    '18.png',
    '19.png',
    '20.png',
    '21.png',
    '22.png',
    '23.png',
    '24.png',
    '25.png',
    '26.png',
    '27.png'
  ];


  const audioMap = {
    '25.png': 'FIRST AUDIO.mp3',
    '21.png': 'SECOND AUDIO.mp3',
    '22.png': 'SECOND AUDIO.mp3',
    '23.png': 'SECOND AUDIO.mp3',
    '24.png': 'SECOND AUDIO.mp3',
    '3.png':  'THIRD AUDIO.mp3',
    '2.png':  'FOURTH AUDIO.mp3',  
    '8.png':  'FIFTH AUDIO.mp3',   
    '9.png':  'FIFTH AUDIO.mp3'
  };

  const audioElements = {};
  const uniqueFiles = [...new Set(Object.values(audioMap))];
  uniqueFiles.forEach(file => {
    const a = new Audio(file);
    a.preload = 'auto';
    audioElements[file] = a;
  });

  let currentAudioFile = null;
  let currentAudio = null;
  let index = 0;
  let isMuted = false;
  let hasInteracted = false;

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
      currentAudioFile = null;
    }
  }

  function playAudioForPage(filename) {
    if (isMuted || !hasInteracted) return;
    
    const audioFile = audioMap[filename];
    
    if (!audioFile) {
      stopAudio();
      return;
    }
    
    if (currentAudioFile === audioFile && currentAudio && !currentAudio.paused) {
      return;
    }
    
    stopAudio();
    if (audioElements[audioFile]) {
      currentAudio = audioElements[audioFile];
      currentAudioFile = audioFile;
      currentAudio.currentTime = 0;
      const playPromise = currentAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log('Audio play blocked:', err.message);
        });
      }
    }
  }

  function showPage() {
    page.style.opacity = 0;
    setTimeout(() => {
      page.src = images[index];
      page.style.opacity = 1;
    }, 120);

    counter.textContent = `${index+1} / ${images.length}`;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === images.length - 1;

    playAudioForPage(images[index]);
  }

  function next() { if (index < images.length - 1) { index++; showPage(); } }
  function prev() { if (index > 0)                 { index--; showPage(); } }

  function markInteracted() {
    if (!hasInteracted) {
      hasInteracted = true;
      playAudioForPage(images[index]);
    }
  }

  prevBtn.addEventListener('click', () => { markInteracted(); prev(); });
  nextBtn.addEventListener('click', () => { markInteracted(); next(); });

  muteBtn.addEventListener('click', () => {
    markInteracted();
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇 Unmute' : '🔊 Mute';
    if (isMuted) {
      stopAudio();
    } else {
      playAudioForPage(images[index]);
    }
  });

  document.addEventListener('keydown', e => {
    markInteracted();
    switch(e.key) {
      case 'ArrowRight': case 'PageDown': case ' ': next(); e.preventDefault(); break;
      case 'ArrowLeft':  case 'PageUp':             prev(); e.preventDefault(); break;
      case 'Home': index = 0; showPage(); break;
      case 'End':  index = images.length - 1; showPage(); break;
    }
  });

  showPage();
})();
</script>
</body>
</html>
